zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 0fbe8ad092c34179971203ca32cfe4bb
    name: Templates/Applications
  templates:
  - uuid: 213b70c0c1bf403a966396a87644574a
    template: Nord Pool prices by didnt.work
    name: Nord Pool prices by didnt.work
    description: Fetches 15-minute Nord Pool electricity prices for LV, LT and EE directly from nordpool.didnt.work using Zabbix HTTP agent items and dependent item preprocessing. No external scripts required.
    vendor:
      name: Community
      version: 7.4-2
    groups:
    - name: Templates/Applications
    items:
    - uuid: a233a559564041d0ac71d19d89c936b0
      name: 'Nord Pool Latvia: API raw'
      type: HTTP_AGENT
      key: nordpool.api.raw[lv]
      delay: 0;m/15s5
      history: 1d
      value_type: TEXT
      url: '{$NORDPOOL.API.URL}/api/lv/prices'
      query_fields:
      - name: resolution
        value: '15'
      - name: vat
        value: '{$NORDPOOL.VAT}'
      status_codes: '200'
      follow_redirects: 'YES'
      retrieve_mode: BODY
      request_method: GET
      output_format: RAW
      verify_peer: 'YES'
      verify_host: 'YES'
      timeout: 10s
      description: Master HTTP item. Fetches today's 15-minute Nord Pool price payload from nordpool.didnt.work.
      tags:
      - tag: component
        value: api
      - tag: country
        value: LV
    - uuid: a9afcaf9aa934301abfae695e16b7e8c
      name: 'Nord Pool Latvia: Current price'
      type: DEPENDENT
      key: nordpool.price.current[lv]
      history: 90d
      value_type: FLOAT
      units: EUR/kWh
      description: Price is converted from API EUR/MWh to EUR/kWh by dividing by 1000. Stored as Zabbix Numeric (float).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var o = JSON.parse(value);\nvar now = Date.now();\nfor (var i = 0; i < o.prices.length; i++) {\n    var p = o.prices[i];\n    if (Date.parse(p.start) <= now && now < Date.parse(p.end)) {\n        return p.value / 1000.0;\n    }\n}\nthrow 'No price interval contains current time';"
      master_item:
        key: nordpool.api.raw[lv]
      tags:
      - tag: component
        value: price
      - tag: country
        value: LV
    - uuid: f3471301464b42edab6c184384a0c755
      name: 'Nord Pool Latvia: Previous interval price'
      type: DEPENDENT
      key: nordpool.price.previous[lv]
      history: 90d
      value_type: FLOAT
      units: EUR/kWh
      description: Price is converted from API EUR/MWh to EUR/kWh by dividing by 1000. Stored as Zabbix Numeric (float).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var o = JSON.parse(value);\nvar now = Date.now();\nfor (var i = 0; i < o.prices.length; i++) {\n    var p = o.prices[i];\n    if (Date.parse(p.start) <= now && now < Date.parse(p.end)) {\n        var j = i + (-1);\n        if (j < 0 || j >= o.prices.length) throw 'Requested adjacent interval is outside current day payload';\n        return o.prices[j].value / 1000.0;\n    }\n}\nthrow 'No price interval contains current time';"
        error_handler: DISCARD_VALUE
      master_item:
        key: nordpool.api.raw[lv]
      tags:
      - tag: component
        value: price
      - tag: country
        value: LV
    - uuid: afc30ab238314c0b8706830aaf4b2157
      name: 'Nord Pool Latvia: Next interval price'
      type: DEPENDENT
      key: nordpool.price.next[lv]
      history: 90d
      value_type: FLOAT
      units: EUR/kWh
      description: Price is converted from API EUR/MWh to EUR/kWh by dividing by 1000. Stored as Zabbix Numeric (float).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var o = JSON.parse(value);\nvar now = Date.now();\nfor (var i = 0; i < o.prices.length; i++) {\n    var p = o.prices[i];\n    if (Date.parse(p.start) <= now && now < Date.parse(p.end)) {\n        var j = i + (1);\n        if (j < 0 || j >= o.prices.length) throw 'Requested adjacent interval is outside current day payload';\n        return o.prices[j].value / 1000.0;\n    }\n}\nthrow 'No price interval contains current time';"
        error_handler: DISCARD_VALUE
      master_item:
        key: nordpool.api.raw[lv]
      tags:
      - tag: component
        value: price
      - tag: country
        value: LV
    - uuid: eacf691f8dd64f50a04ec1bdb9c0cf71
      name: 'Nord Pool Latvia: Today average price'
      type: DEPENDENT
      key: nordpool.price.today.avg[lv]
      history: 90d
      value_type: FLOAT
      units: EUR/kWh
      description: Price is converted from API EUR/MWh to EUR/kWh by dividing by 1000. Stored as Zabbix Numeric (float).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var o = JSON.parse(value);

          if (!o.prices || !o.prices.length) throw ''No prices in payload'';

          var s=0; for (var i=0;i<o.prices.length;i++) s += o.prices[i].value; return (s/o.prices.length)/1000.0;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: nordpool.api.raw[lv]
      tags:
      - tag: component
        value: price
      - tag: country
        value: LV
    - uuid: fccaeccc9cb841de86e583e2601332ef
      name: 'Nord Pool Latvia: Today minimum price'
      type: DEPENDENT
      key: nordpool.price.today.min[lv]
      history: 90d
      value_type: FLOAT
      units: EUR/kWh
      description: Price is converted from API EUR/MWh to EUR/kWh by dividing by 1000. Stored as Zabbix Numeric (float).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var o = JSON.parse(value);

          if (!o.prices || !o.prices.length) throw ''No prices in payload'';

          var x=o.prices[0].value; for (var i=1;i<o.prices.length;i++) if (o.prices[i].value < x) x=o.prices[i].value; return x/1000.0;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: nordpool.api.raw[lv]
      tags:
      - tag: component
        value: price
      - tag: country
        value: LV
    - uuid: a648b17af6704dab88971542b35fe369
      name: 'Nord Pool Latvia: Today maximum price'
      type: DEPENDENT
      key: nordpool.price.today.max[lv]
      history: 90d
      value_type: FLOAT
      units: EUR/kWh
      description: Price is converted from API EUR/MWh to EUR/kWh by dividing by 1000. Stored as Zabbix Numeric (float).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var o = JSON.parse(value);

          if (!o.prices || !o.prices.length) throw ''No prices in payload'';

          var x=o.prices[0].value; for (var i=1;i<o.prices.length;i++) if (o.prices[i].value > x) x=o.prices[i].value; return x/1000.0;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
